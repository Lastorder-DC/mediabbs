[package]
name = "mediabbs"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
anyhow = "1"
# HTTP/2 off: the backend sits behind a reverse proxy and only speaks HTTP/1.1.
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat"] }
awc = { version = "3", features = ["openssl"] }
openssl = "0.10"
actix-cors = "0.7"
actix-web-validator = "7"
validator = { version = "0.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diesel = { version = "2.3", features = ["mysql", "r2d2", "chrono"] }
diesel_migrations = { version = "2.3", features = ["mysql"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-actix = "0.49"
log = "0.4"
env_logger = "0.11"
derive_more = { version = "2", features = ["display", "error"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
nanoid = "0.5"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# No legacy hyper 0.14 / rustls 0.21 client ("rustls" feature) and no SigV4a.
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["sync"] }
mime_guess = "2"
base64 = "0.22"

[dev-dependencies]
actix-rt = "2"
