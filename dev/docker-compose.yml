# Local development / test environment for mediabbs:
#   wiki     MediaWiki 1.43 + Extension:OAuth (SQLite), auto-configured
#   db       MariaDB for mediabbs
#   backend  mediabbs (built from ..)
#   client   mediabbs-client (built from $MEDIABBS_CLIENT_DIR, default ../../mediabbs-client)
#
#   docker compose up -d --build
#   open http://127.0.0.1:18090   (users: Admin / Alice / Moderator / Blocked, see README.md)
#
# All ports are bound to 127.0.0.1. NOT for production use.

name: mediabbs-dev

services:
  wiki:
    build: ./mediawiki
    environment:
      WIKI_SERVER: http://127.0.0.1:18100
      WIKI_LANG: ${WIKI_LANG:-ko}
      BBS_CALLBACK: http://127.0.0.1:18090/auth
      OAUTH2_ACCESS_TOKEN_TTL: ${OAUTH2_ACCESS_TOKEN_TTL:-PT1H}
    volumes:
      - wiki-data:/var/www/data
      - shared:/shared
    ports:
      - "127.0.0.1:18100:80"
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared/oauth.env && curl -fsS 'http://localhost/api.php?action=query&meta=siteinfo&format=json' | grep -q sitename"]
      interval: 5s
      timeout: 5s
      retries: 60

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: mediabbs
      MARIADB_USER: mediabbs
      MARIADB_PASSWORD: mediabbs
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ..
      # Version on the admin page; empty = plain "0.3.0" (see README).
      args: { MEDIABBS_GIT_HASH: "${MEDIABBS_GIT_HASH:-}" }
    depends_on:
      wiki: { condition: service_healthy }
      db: { condition: service_healthy }
    environment:
      BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: mysql://mediabbs:mediabbs@db/mediabbs
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18090
      # Requests arrive through Docker's port forwarding.
      TRUST_PROXY: "false"
      # Browsers use the public URL; the backend talks to the wiki container directly.
      MW_BASE_URL: http://127.0.0.1:18100
      MW_API_URL: http://wiki/api.php
      MW_REST_URL: http://wiki/rest.php
      OAUTH_PUBLIC_KEY_PATH: /shared/pubkey.pem
      ADMIN_GROUPS: sysop,boardmanager
      COOKIE_SECURE: "false"
      STORAGE_BACKEND: local
      UPLOAD_PUBLIC_URL: http://127.0.0.1:18081/uploads/
      DEFAULT_BOARD: free
      # The e2e tests post far more than people do (default 10 per minute).
      POSTS_PER_MINUTE: "600"
      RUST_LOG: actix_web=info,mediabbs=debug
    volumes:
      - shared:/shared:ro
      - uploads:/app/uploads
    # OAuth credentials are generated by the wiki container on first start.
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -a; . /shared/oauth.env; set +a
        mediabbs migrate
        mediabbs board list | grep -q ' free ' || mediabbs board add free 자유게시판
        mediabbs board list | grep -q ' archive ' || { mediabbs board add archive 보관함 && mediabbs board disable archive; }
        exec mediabbs serve
    ports:
      - "127.0.0.1:18081:8080"

  client:
    build:
      context: ${MEDIABBS_CLIENT_DIR:-../../mediabbs-client}
      args: { MEDIABBS_GIT_HASH: "${MEDIABBS_CLIENT_GIT_HASH:-}" }
    depends_on: [backend]
    environment:
      BACKEND_HOST: http://127.0.0.1:18081
      # Same as the public demo: Liberty by default, a short menu for Simple.
      SKIN: liberty
      MENUS: '{"simple":[{"type":"boards"},{"type":"wiki"}]}'
    ports:
      - "127.0.0.1:18090:80"

volumes:
  wiki-data:
  db-data:
  shared:
  uploads:
